# ===============================
# App
# ===============================
spring.application.name=studsluzba-server

# Keep SQL noise down (flip to true while debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.tool.schema=OFF

# Safer default: don?t keep the session open across view rendering
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}

# ===============================
# Datasource (defaults to embedded H2, override with DB_* env vars when needed)
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:studsluzba;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.datasource.hikari.connectionInitSql=${JDBC_INIT_SQL:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
